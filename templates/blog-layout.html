<!DOCTYPE html>
<html lang="en" class="blogpage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="{% if current_url %}{{ current_url | safe }}{% else %}{{ get_url(path='/') }}{% endif %}">
    <link rel="icon" type="image/png" href="{{ get_url(path='favicon.ico') }}"/>
    <link rel="alternate" type="application/atom+xml" href="{{ get_url(path='atom.xml') }}">
    <title>{% if page.title %}{{ page.title }}{% else %}Blog{% endif %}</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ get_url(path='bloginnerstyle.css') }}">
    <script src="{{ get_url(path="js/theme.js") }}"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><a href="{{ get_url(path='/') }}">penguin</a></div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme"></button>
        </header>
        <a href="{{ get_url(path='blog/') }}" class="back-link">Back</a>
        <article>
            {% block content %} {% endblock content %}
        </article>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.content pre').forEach(function (pre) {
                var btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'copy';
                btn.setAttribute('aria-label', 'Copy code to clipboard');
                btn.addEventListener('click', function () {
                    var code = pre.querySelector('code');
                    var text = code ? code.textContent : pre.textContent;
                    navigator.clipboard.writeText(text).then(function () {
                        btn.textContent = 'copied!';
                        btn.classList.add('copied');
                        setTimeout(function () {
                            btn.textContent = 'copy';
                            btn.classList.remove('copied');
                        }, 2000);
                    });
                });
                pre.appendChild(btn);
            });
        });
    </script>
</body>
</html>
